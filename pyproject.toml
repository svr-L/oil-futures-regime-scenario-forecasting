[project]
name = "oil-futures-regime-scenario-forecasting"
version = "1.0.0"
description = "Joint WTI/Brent scenario generation under P with flexible probabilities, macro conditioning, VECM error correction, GARCH filtering and rolling distributional validation with significance testing."
requires-python = ">=3.10"
authors = [{name = "Saverio Lauriola"}]
readme = "README.md"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "statsmodels>=0.14",
  "scipy>=1.11",
  "arch>=6.3",
  "pyarrow>=15.0",
  "tabulate>=0.9",
]

[project.optional-dependencies]
data = ["yfinance>=0.2", "xlrd>=2.0"]
dev = ["pytest>=8", "jupyter>=1.0", "ipykernel>=6.0", "tabulate>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]
