[project]
name = "oil-futures-regime-scenario-forecasting"
version = "0.1.0"
description = "Regime-aware scenario forecasting for WTI/Brent futures using AR residuals, flexible probabilities, macro-conditioned bootstrap, Johansen cointegration and Kalman filtering."
requires-python = ">=3.10"
authors = [{name = "Saverio Lauriola"}]
readme = "README.md"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
